name: Reproducibility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-render.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_inputs.py
      - run: python scripts/evaluate.py
      - run: python scripts/check_results.py
      - run: python scripts/check_extended.py
      - run: python demos/real_driving/verify_demo.py --decisions-only
